name: frontend

on:
  push:
    branches:
      - main
    paths:
      - ERP.Frontend/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_CLIENT_SUBSCRIPTION }}

      - name: Point the site at the API
        run: |
          sed -i 's|http://localhost:5080|https://app-erp-demo-dev.azurewebsites.net|' ERP.Frontend/js/config.js

      - name: Read Static Web App token
        run: |
          token=$(az staticwebapp secrets list \
            --name stapp-erp-demo-dev \
            --resource-group rg-erp-demo-dev \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ERP.Frontend
          api_location: ""
          output_location: ""
          skip_app_build: true
