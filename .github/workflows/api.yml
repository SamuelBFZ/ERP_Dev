name: api

on:
  push:
    branches:
      - main
    paths:
      - ERP.Backend/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_CLIENT_SUBSCRIPTION }}

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az acr build \
            --registry acrerpdemodev \
            --image "erp-api:$IMAGE_TAG" \
            ERP.Backend/ERP.Api

      - name: Deploy App Service
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az deployment group create \
            --resource-group rg-erp-demo-dev \
            --template-file infra/appservice.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" imageTag="$IMAGE_TAG"
