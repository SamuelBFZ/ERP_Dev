<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <strong>ERP</strong>
    <a href="index.html">Home</a>
  </header>
  <main>
    <form id="login-form">
      <h1>Login</h1>
      <p class="hint">Username <code>admin</code>. Password is the configured token. Locally it is <code>dev-token</code>.</p>
      <label>Username <input id="username" name="username" autocomplete="username" required></label>
      <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Log in</button>
      <p id="message"></p>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
</body>
</html>
