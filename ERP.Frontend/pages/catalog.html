<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <strong>ERP</strong>
    <a href="../index.html">Home</a>
    <a href="customers.html">Customers</a>
    <a href="sales.html">Sales</a>
    <button type="button" id="logout">Log out</button>
  </header>
  <main>
    <form id="category-form">
      <h1>New category</h1>
      <label>Name <input id="category-name" required></label>
      <label>Description <input id="category-description"></label>
      <button type="submit">Save category</button>
    </form>
    <form id="product-form">
      <h1>New product</h1>
      <p class="hint">Initial quantity is the starting stock.</p>
      <label>Name <input id="product-name" required></label>
      <label>Description <input id="product-description"></label>
      <label>Price <input id="price" type="number" min="0" step="0.01" required></label>
      <label>Category
        <select id="category-id" required></select>
      </label>
      <label>Initial quantity <input id="initial-quantity" type="number" min="0" step="1" value="0" required></label>
      <button type="submit">Save product</button>
    </form>
    <p id="message"></p>
    <section>
      <h2>Catalog</h2>
      <table>
        <thead>
          <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Active</th></tr>
        </thead>
        <tbody id="catalog-body"></tbody>
      </table>
    </section>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/catalog.js"></script>
</body>
</html>
